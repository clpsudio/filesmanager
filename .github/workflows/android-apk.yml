# Builds the signed release APK of "Files" (com.clpstudio.filesmanager).
#
# Runs on every push to main and from the Actions tab ("Run workflow").
# Download the APK from the run page: Artifacts > files-release-apk.
#
# versionName 1.0.<run number>, versionCode = run number, so every build
# installs over the previous one.
#
# Signing: the release key lives ONLY in the repository secrets
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD). It is written to the runner's temp folder for the
# build and deleted afterwards. Never commit a keystore.
#
# The app is fully offline: the build fails if the final APK asks for the
# INTERNET permission (or any network permission).
#
# FFmpeg (LGPL-2.1-or-later) is built from source in decoder-ffmpeg/ (pinned in
# scripts/ffmpeg/versions.env). Every APK artifact is accompanied by the
# "ffmpeg-corresponding-source" artifact (FFmpeg source tarball, build scripts,
# decoder module source and relink kit), which must also be attached to any
# published release next to the APK.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build signed APK
    # Only the CLP Studio repository holds the signing secrets; forks skip this job
    # (pull requests are checked by ci.yml instead).
    if: ${{ github.repository == 'clpsudio/filesmanager' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Fails if any prebuilt .so/.a (or other native binary) is committed, so FFmpeg and
      # libffmpegJNI.so always come from the pinned source below, never from a stored binary.
      - name: Guard - no prebuilt native libraries in the repository
        shell: bash
        run: bash scripts/ci/check-no-prebuilt-native.sh

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install the pinned NDK and CMake
        shell: bash
        run: |
          source scripts/ffmpeg/versions.env
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          grep -q "Pkg.Revision = $NDK_VERSION" "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Only the FFmpeg source tarball is cached (fetch-ffmpeg.sh checks its sha256 and the
      # unpacked tree hash on every run). FFmpeg itself is compiled from that source in every
      # run; no previously built FFmpeg library or .so is restored.
      - name: Cache the FFmpeg source tarball
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-download
          key: ffmpeg-src-${{ hashFiles('scripts/ffmpeg/versions.env') }}

      - name: Build FFmpeg (sha256-checked source, pinned NDK)
        shell: bash
        run: |
          test ! -e decoder-ffmpeg/src/main/jni/ffmpeg/android-libs || { echo "::error::FFmpeg libraries exist before the build"; exit 1; }
          scripts/ffmpeg/build-ffmpeg.sh "$ANDROID_NDK_HOME"

      # A Linux build of the same decoder sources, so the JVM tests can run the real
      # Java -> JNI -> FFmpeg decoding path (never packaged; the APK has only ARM code).
      - name: Build the host decoder library for JVM tests
        shell: bash
        run: scripts/ffmpeg/build-host-jni-for-tests.sh

      - name: Version of this APK
        shell: bash
        run: |
          echo "APK version $APP_VERSION_NAME (version code $APP_VERSION_CODE)"
          echo "### Files $APP_VERSION_NAME (version code **$APP_VERSION_CODE**)" >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :decoder-ffmpeg:testDebugUnitTest -Pclp.requireHostFfmpeg=true :app:lintDebug :decoder-ffmpeg:lintDebug --no-daemon --stacktrace

      - name: Prepare the signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::The signing secrets are missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Remove the signing key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Check the APK (no internet permission, signature, version)
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/aapt2" dump permissions "$apk" | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE)" permissions.txt; then
            echo "::error::The APK asks for a network permission. Files must work fully offline."
            exit 1
          fi
          "$bt/aapt2" dump badging "$apk" | grep -E "^(package|minSdkVersion|targetSdkVersion|native-code)"
          # Native code: exactly the two ARM ABIs, each with the FFmpeg decoder library.
          unzip -l "$apk" | awk '{print $4}' | grep '^lib/' | sort | tee native-libs.txt
          grep -qx 'lib/arm64-v8a/libffmpegJNI.so' native-libs.txt
          grep -qx 'lib/armeabi-v7a/libffmpegJNI.so' native-libs.txt
          if grep -vE '^lib/(arm64-v8a|armeabi-v7a)/' native-libs.txt; then
            echo "::error::Unexpected native ABI in the APK."
            exit 1
          fi
          # Exactly the 6 bundled FFmpeg decoders in each ABI's library; AAC, E-AC-3, DTS, MLP and TrueHD absent.
          python3 scripts/ci/check-ffmpeg-decoders.py "$apk"
          # R8 kept the decoder/JNI, archive, PDF and player classes; every JNI export has its native method.
          python3 scripts/ci/check-apk-r8.py "$apk" --mapping app/build/outputs/mapping/release/mapping.txt --dexdump "$bt/dexdump"
          # The licence texts shown in Settings > Open-source licences.
          for f in LICENSE ABOUT.txt Apache-2.0.txt FFMPEG-NOTICE.txt FFMPEG-SOURCE.txt FFMPEG-RELINKING.txt LGPL-2.1.txt MIT-musl-avsscanf.txt NOTICE THIRD_PARTY_LICENSES.md; do
            unzip -l "$apk" "assets/licenses/$f" > /dev/null || { echo "::error::assets/licenses/$f missing from the APK"; exit 1; }
          done
          "$bt/apksigner" verify --print-certs "$apk" | grep -E "DN|SHA-256|SHA-1"
          mkdir -p dist
          cp "$apk" "dist/files-$APP_VERSION_NAME.apk"
          # The licence text and third-party notices travel with every distributed APK.
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md RELINKING.md dist/

      - name: FFmpeg corresponding source bundle
        shell: bash
        run: scripts/ffmpeg/make-corresponding-source.sh "$APP_VERSION_NAME" dist/source

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: files-release-apk
          path: |
            dist/files-*.apk
            dist/LICENSE
            dist/NOTICE
            dist/THIRD_PARTY_LICENSES.md
            dist/RELINKING.md
          if-no-files-found: error
          retention-days: 90

      - name: Upload FFmpeg corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-corresponding-source
          path: dist/source/*.tar.gz
          if-no-files-found: error
          retention-days: 90
