# Builds the signed release APK of "Files" (com.clpstudio.filesmanager).
#
# Runs on every push to main and from the Actions tab ("Run workflow").
# Download the APK from the run page: Artifacts > files-release-apk.
#
# versionName 1.0.<run number>, versionCode = run number, so every build
# installs over the previous one.
#
# Signing: the release key lives ONLY in the repository secrets
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD). It is written to the runner's temp folder for the
# build and deleted afterwards. Never commit a keystore.
#
# The app is fully offline: the build fails if the final APK asks for the
# INTERNET permission (or any network permission).
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Version of this APK
        shell: bash
        run: |
          echo "APK version $APP_VERSION_NAME (version code $APP_VERSION_CODE)"
          echo "### Files $APP_VERSION_NAME (version code **$APP_VERSION_CODE**)" >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Prepare the signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::The signing secrets are missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Remove the signing key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Check the APK (no internet permission, signature, version)
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/aapt2" dump permissions "$apk" | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE)" permissions.txt; then
            echo "::error::The APK asks for a network permission. Files must work fully offline."
            exit 1
          fi
          "$bt/aapt2" dump badging "$apk" | head -1
          "$bt/apksigner" verify --print-certs "$apk" | grep -E "DN|SHA-256|SHA-1"
          mkdir -p dist
          cp "$apk" "dist/files-$APP_VERSION_NAME.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: files-release-apk
          path: dist/files-*.apk
          if-no-files-found: error
          retention-days: 90
