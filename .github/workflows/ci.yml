# Checks pull requests and branches without any signing keys:
# unit tests, lint, the FFmpeg decoder build, an unsigned release build, the
# offline (no network permission) check and the APK contents. The signed APK is
# built only by android-apk.yml on main (CLP Studio's repository only).
#
# Artifacts (unsigned, for checking only):
#   files-unsigned-apk            the unsigned APK + LICENSE.pending-review.md, NOTICE, THIRD_PARTY_LICENSES.md
#   ffmpeg-corresponding-source   FFmpeg source tarball, build scripts, decoder module source, relink kit
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, lint and unsigned release build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install the pinned NDK and CMake
        shell: bash
        run: |
          source scripts/ffmpeg/versions.env
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          grep -q "Pkg.Revision = $NDK_VERSION" "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # FFmpeg's static libraries depend only on the pinned commit, the configure
      # script and decoder list, and the NDK, all of which are in these files.
      - name: Cache FFmpeg build
        uses: actions/cache@v4
        with:
          path: |
            decoder-ffmpeg/src/main/jni/ffmpeg
            build/ffmpeg-download
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg/versions.env', 'scripts/ffmpeg/fetch-ffmpeg.sh', 'scripts/ffmpeg/build-ffmpeg.sh', 'decoder-ffmpeg/src/main/jni/build_ffmpeg.sh') }}

      - name: Build FFmpeg (sha256-checked source, pinned NDK)
        shell: bash
        run: scripts/ffmpeg/build-ffmpeg.sh "$ANDROID_NDK_HOME"

      # A Linux build of the same decoder sources, so the JVM tests can run the real
      # Java -> JNI -> FFmpeg decoding path (never packaged; the APK has only ARM code).
      - name: Build the host decoder library for JVM tests
        shell: bash
        run: scripts/ffmpeg/build-host-jni-for-tests.sh

      - name: Unit tests, lint and release build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :decoder-ffmpeg:testDebugUnitTest -Pclp.requireHostFfmpeg=true :app:lintDebug :decoder-ffmpeg:lintDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Check the APK (no network permission, ABIs, decoder library, licence texts)
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/aapt2" dump permissions "$apk" | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE)" permissions.txt; then
            echo "::error::The APK asks for a network permission. Files must work fully offline."
            exit 1
          fi
          "$bt/aapt2" dump badging "$apk" | grep -E "^(package|minSdkVersion|targetSdkVersion|native-code)"
          # Native code: exactly the two ARM ABIs, each with the FFmpeg decoder library.
          unzip -l "$apk" | awk '{print $4}' | grep '^lib/' | sort | tee native-libs.txt
          grep -qx 'lib/arm64-v8a/libffmpegJNI.so' native-libs.txt
          grep -qx 'lib/armeabi-v7a/libffmpegJNI.so' native-libs.txt
          if grep -vE '^lib/(arm64-v8a|armeabi-v7a)/' native-libs.txt; then
            echo "::error::Unexpected native ABI in the APK."
            exit 1
          fi
          # The licence texts shown in Settings > Open-source licences.
          for f in FFMPEG-NOTICE.txt LGPL-2.1.txt MIT-musl-avsscanf.txt UnRAR-junrar-7.5.5.txt NOTICE THIRD_PARTY_LICENSES.md; do
            unzip -l "$apk" "assets/licenses/$f" > /dev/null || { echo "::error::assets/licenses/$f missing from the APK"; exit 1; }
          done
          mkdir -p dist
          cp "$apk" dist/files-unsigned.apk
          cp LICENSE.pending-review.md NOTICE THIRD_PARTY_LICENSES.md RELINKING.md dist/

      - name: FFmpeg corresponding source bundle
        shell: bash
        run: scripts/ffmpeg/make-corresponding-source.sh "ci-${{ github.sha }}" dist/source

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v7
        with:
          name: files-unsigned-apk
          path: |
            dist/files-unsigned.apk
            dist/LICENSE.pending-review.md
            dist/NOTICE
            dist/THIRD_PARTY_LICENSES.md
            dist/RELINKING.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload FFmpeg corresponding source
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-corresponding-source
          path: dist/source/*.tar.gz
          if-no-files-found: error
          retention-days: 14
