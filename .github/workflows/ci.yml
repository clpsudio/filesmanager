# Checks pull requests and branches without any signing keys:
# unit tests, lint, an unsigned release build and the offline (no network
# permission) check. The signed APK is built only by android-apk.yml on main.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, lint and unsigned release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Unit tests, lint and release build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Check the APK has no network permission
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/aapt2" dump permissions "$apk" | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE)" permissions.txt; then
            echo "::error::The APK asks for a network permission. Files must work fully offline."
            exit 1
          fi
